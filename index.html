<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floating Lyrics Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #121212;
        color: #e0e0e0;
      }
      .draggable {
        cursor: move;
      }
      #lyricsContainer {
        /* Use a responsive max-height so added content (YouTube player/results) won't push the lyrics off-screen */
        max-height: 60vh;
        height: auto;
        background-color: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(10px);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }
      #lyricsDisplay {
        scroll-behavior: smooth;
        max-height: calc(60vh - 120px);
      }
      /* Responsive YouTube player wrapper keeps aspect ratio */
      .yt-wrapper {
        position: relative;
        width: 100%;
        padding-bottom: 56.25%; /* 16:9 */
      }
      .yt-wrapper iframe {
        position: absolute;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
      }
      #lyricsDisplay::-webkit-scrollbar {
        width: 4px;
      }
      #lyricsDisplay::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.2);
        border-radius: 20px;
      }
      .form-input,
      .btn {
        border-radius: 8px;
        transition: all 0.3s ease;
      }
      .form-input {
        background-color: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .form-input:focus {
        background-color: rgba(255, 255, 255, 0.1);
        border-color: #4a90e2;
        box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.5);
        outline: none;
      }
      .btn {
        background-color: #4a90e2;
      }
      .btn:hover {
        background-color: #357abd;
      }
      .error-message {
        color: #ef4444;
      }
      .loading-spinner {
        border-top-color: #4a90e2;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <style>
      /* Responsive layout: desktop vertical stack, on small landscape screens show horizontal split */
      @media (max-width: 640px) and (orientation: landscape) {
        body {
          padding: 8px;
        }
        #appContainer {
          display: flex;
          flex-direction: row;
          gap: 8px;
          align-items: stretch;
        }
        #lyricsContainer {
          flex: 1 1 50%;
          max-height: none;
        }
        .bg-gray-800\/50 {
          flex: 1 1 50%;
        }
        #lyricsDisplay {
          max-height: none;
          overflow-y: auto;
        }
        .yt-wrapper {
          padding-bottom: 40%;
        }
      }
      @media (min-width: 641px) {
        /* Desktop tweaks */
        #appContainer {
          max-width: 1100px;
        }
        #lyricsContainer {
          max-height: 65vh;
        }
      }
    </style>
  </head>
  <body class="flex items-start justify-center min-h-screen overflow-auto py-6">
    <!-- responsive container: small screens full-width, larger screens allow wider layout -->
    <div
      id="appContainer"
      class="w-full max-w-md md:max-w-2xl lg:max-w-3xl p-4 space-y-4 mx-auto"
    >
      <div id="lyricsContainer" class="flex flex-col">
        <!-- Header -->
        <div
          id="dragHandle"
          class="draggable text-center p-2 bg-gray-800/50 rounded-t-lg"
          style="-webkit-app-region: drag"
        >
          <h1 class="text-lg font-bold text-white">Floating Lyrics</h1>
        </div>
        <!-- Lyrics Display -->
        <div
          id="lyricsDisplay"
          class="flex-grow p-6 overflow-y-auto text-center text-lg leading-relaxed"
        >
          Lyrics will appear here...
        </div>
        <!-- Always On Top Toggle -->
        <div
          class="p-2 text-center bg-gray-800/50 rounded-b-lg flex justify-center items-center"
        >
          <button
            id="alwaysOnTopBtn"
            class="text-sm text-white bg-blue-500 hover:bg-blue-600 px-3 py-1 rounded-full focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-800 focus:ring-white"
          >
            Enable Always-On-Top
          </button>
        </div>
      </div>
      <!-- Search Form -->
      <div class="bg-gray-800/50 p-4 rounded-lg shadow-lg">
        <div class="space-y-4">
          <!-- Audio player and sync controls -->
          <div class="space-y-2">
            <audio
              id="audio"
              controls
              preload="metadata"
              class="w-full"
            ></audio>
            <div class="flex gap-2">
              <label
                class="form-input w-full p-1 text-sm text-white flex items-center justify-center"
                style="cursor: pointer"
              >
                Load audio
                <input
                  id="audioFile"
                  type="file"
                  accept="audio/*"
                  style="display: none"
                />
              </label>
              <label
                class="form-input w-full p-1 text-sm text-white flex items-center justify-center"
                style="cursor: pointer"
              >
                Load LRC
                <input
                  id="lrcFile"
                  type="file"
                  accept=".lrc,text/plain"
                  style="display: none"
                />
              </label>
            </div>
            <div class="flex gap-2">
              <button id="startSyncBtn" class="btn p-1 text-sm">
                Start Tap-Sync
              </button>
              <button id="finishSyncBtn" class="btn p-1 text-sm">
                Finish Sync
              </button>
              <button id="clearSyncBtn" class="btn p-1 text-sm">
                Clear Sync
              </button>
              <button id="anchorOffsetBtn" class="btn p-1 text-sm">
                Anchor current line to playback
              </button>
              <button id="resetOffsetBtn" class="btn p-1 text-sm">
                Reset Offset
              </button>
            </div>
            <div id="syncHint" class="text-xs text-gray-300">
              Tip: Load audio, press Start Tap-Sync, then press space or click
              anywhere to mark each lyric line while the audio plays.
            </div>
          </div>
          <div>
            <input
              id="artist"
              type="text"
              placeholder="Artist"
              class="form-input w-full p-2 text-white"
            />
          </div>
          <div>
            <input
              id="song"
              type="text"
              placeholder="Song Title"
              class="form-input w-full p-2 text-white"
            />
          </div>
          <div
            id="suggestions"
            class="bg-gray-800/80 rounded mt-2 p-1 hidden max-h-40 overflow-auto"
          ></div>
          <button id="searchBtn" class="btn w-full p-2 font-bold text-white">
            Search Lyrics
          </button>
          <div id="message" class="text-center h-5"></div>
          <!-- YouTube player moved above search inputs so it doesn't push lyrics down -->
          <div id="ytPlayerArea" class="mb-2">
            <div
              id="ytPlayerPlaceholder"
              class="w-full text-center text-sm text-gray-400"
            >
              YouTube player will appear here when you play a result
            </div>
          </div>
          <div class="mt-2">
            <input
              id="ytQuery"
              type="text"
              placeholder="Search YouTube (play songs)"
              class="form-input w-full p-2 text-white"
            />
            <div id="ytResults" class="mt-2 grid grid-cols-1 gap-2"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.5/dist/jsmediatags.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
      // Client no longer calls Genius directly. Requests go to the local proxy at /api/search
      const artistInput = document.getElementById("artist");
      const songInput = document.getElementById("song");
      const searchBtn = document.getElementById("searchBtn");
      const lyricsDisplay = document.getElementById("lyricsDisplay");
      const messageEl = document.getElementById("message");
      const alwaysOnTopBtn = document.getElementById("alwaysOnTopBtn");

      let isAlwaysOnTop = false;
      let pictureInPictureWindow = null;

      async function searchLyrics() {
        const artist = artistInput.value.trim();
        const song = songInput.value.trim();
        if (!artist || !song) {
          showMessage("Please enter both artist and song.", "error");
          return;
        }

        showMessage("Searching...", "loading");
        lyricsDisplay.innerHTML = "";

        try {
          // Call our local proxy which performs the Genius API request and scrapes lyrics server-side.
          const res = await fetch(
            `/api/search?artist=${encodeURIComponent(
              artist
            )}&song=${encodeURIComponent(song)}`
          );
          if (!res.ok) throw new Error("Server error");
          const data = await res.json();

          if (data.lyrics) {
            // Format lyrics: convert bracketed headings [Chorus] into bold section titles
            const formatted = data.lyrics
              .replace(/\r/g, "")
              .split("\n")
              .map((line) => line.trimEnd())
              .map((line) => {
                if (/^\[.*\]$/.test(line))
                  return `<div class="section-title text-white font-semibold mt-3">${line}</div>`;
                if (line === "")
                  return '<div class="spacer" style="height:8px"></div>';
                return `<div>${escapeHtml(line)}</div>`;
              })
              .join("");
            lyricsDisplay.innerHTML = formatted;
            showMessage("Lyrics found!", "success");
          } else if (data.songUrl) {
            lyricsDisplay.innerHTML = `Lyrics found, but could not parse. <a href="${data.songUrl}" target="_blank" class="text-blue-400 underline">View on Genius.com</a>`;
            showMessage("Partial lyrics loaded.", "error");
          } else {
            lyricsDisplay.innerHTML = `Lyrics not found. <a href="https://genius.com/search?q=${encodeURIComponent(
              artist + " " + song
            )}" target="_blank" class="text-blue-400 underline">Search on Genius.com</a>`;
            showMessage("Lyrics not found.", "error");
          }
        } catch (err) {
          console.error(err);
          lyricsDisplay.innerHTML = `Error fetching lyrics. <a href="https://genius.com/search?q=${encodeURIComponent(
            artist + " " + song
          )}" target="_blank" class="text-blue-400 underline">Try on Genius.com</a>`;
          showMessage("Error fetching lyrics.", "error");
        }
      }

      function showMessage(message, type = "info") {
        messageEl.innerHTML = "";
        if (type === "loading") {
          const spinner = document.createElement("div");
          spinner.className =
            "loading-spinner w-5 h-5 border-4 border-gray-400 border-t-blue-500 rounded-full animate-spin mx-auto";
          messageEl.appendChild(spinner);
        } else {
          const text = document.createElement("p");
          text.textContent = message;
          text.className = type === "error" ? "text-red-500" : "text-green-500";
          messageEl.appendChild(text);
          setTimeout(() => {
            if (messageEl.contains(text)) messageEl.removeChild(text);
          }, 3000);
        }
      }

      searchBtn.addEventListener("click", searchLyrics);
      songInput.addEventListener("keyup", (event) => {
        if (event.key === "Enter") searchLyrics();
      });

      // Autocomplete suggestions
      const suggestionsEl = document.getElementById("suggestions");
      let suggestTimer = null;
      async function fetchSuggestions(q) {
        if (!q || q.trim().length < 2) {
          suggestionsEl.classList.add("hidden");
          return;
        }
        try {
          const res = await fetch(`/api/suggest?q=${encodeURIComponent(q)}`);
          const json = await res.json();
          const list = json.suggestions || [];
          if (list.length === 0) {
            suggestionsEl.classList.add("hidden");
            return;
          }
          suggestionsEl.innerHTML = list
            .map(
              (s) =>
                `<div class="p-2 hover:bg-gray-700 cursor-pointer suggestion-item" data-title="${escapeHtml(
                  s.title
                )}" data-artist="${escapeHtml(s.primary_artist)}">${escapeHtml(
                  s.full_title
                )}</div>`
            )
            .join("");
          suggestionsEl.classList.remove("hidden");
          // attach click handlers
          Array.from(
            suggestionsEl.querySelectorAll(".suggestion-item")
          ).forEach((el) => {
            el.addEventListener("click", () => {
              const a = el.getAttribute("data-artist") || "";
              const t = el.getAttribute("data-title") || "";
              artistInput.value = a;
              songInput.value = t;
              suggestionsEl.classList.add("hidden");
              searchLyrics();
            });
          });
        } catch (err) {
          console.warn("suggest fetch failed", err);
          suggestionsEl.classList.add("hidden");
        }
      }

      function scheduleSuggest(q) {
        clearTimeout(suggestTimer);
        suggestTimer = setTimeout(() => fetchSuggestions(q), 250);
      }

      artistInput.addEventListener("input", (e) =>
        scheduleSuggest(e.target.value)
      );
      songInput.addEventListener("input", (e) =>
        scheduleSuggest(`${artistInput.value} ${e.target.value}`)
      );

      // YouTube search + player
      const ytQuery = document.getElementById("ytQuery");
      const ytResults = document.getElementById("ytResults");
      let ytTimer = null;

      ytQuery.addEventListener("input", () => {
        clearTimeout(ytTimer);
        ytTimer = setTimeout(fetchYT, 400);
      });

      async function fetchYT() {
        const q = ytQuery.value.trim();
        if (!q) {
          ytResults.innerHTML = "";
          return;
        }
        let res;
        try {
          res = await fetch(`/api/ytsearch?q=${encodeURIComponent(q)}`);
        } catch (err) {
          ytResults.innerHTML = `<div class="text-red-400">Network error: ${err.message}</div>`;
          return;
        }
        if (!res.ok) {
          let msg = "YouTube API key missing or error";
          try {
            const body = await res.json();
            if (body && body.error) msg = body.error;
          } catch (e) {}
          ytResults.innerHTML = `<div class="text-red-400">${escapeHtml(
            msg
          )}</div>`;
          return;
        }
        const json = await res.json();
        const items = json.items || [];
        ytResults.innerHTML = items
          .map(
            (it) => `
                <div class="p-2 bg-gray-900 rounded flex items-center gap-3">
                    <img src="${
                      it.thumbnails?.default?.url || ""
                    }" width="80" height="45" />
                    <div class="flex-1">
                        <div class="font-semibold">${escapeHtml(it.title)}</div>
                        <div class="text-xs text-gray-400">${escapeHtml(
                          it.channelTitle
                        )}</div>
                    </div>
                    <div class="flex flex-col gap-1">
                        <button class="btn play-yt" data-id="${
                          it.id
                        }">Play</button>
                        <button class="btn convert-yt" data-id="${
                          it.id
                        }">Convert to MP3</button>
                    </div>
                </div>
            `
          )
          .join("");
        Array.from(ytResults.querySelectorAll(".play-yt")).forEach((b) =>
          b.addEventListener("click", () => playYT(b.getAttribute("data-id")))
        );
        Array.from(ytResults.querySelectorAll(".convert-yt")).forEach((b) =>
          b.addEventListener("click", () =>
            convertYTToMP3(b.getAttribute("data-id"))
          )
        );
        Array.from(ytResults.querySelectorAll(".external-yt")).forEach((b) =>
          b.addEventListener("click", () =>
            openExternalConverter(b.getAttribute("data-id"))
          )
        );
        Array.from(ytResults.querySelectorAll(".rapid-yt")).forEach((b) =>
          b.addEventListener("click", () =>
            convertWithRapidAPI(b.getAttribute("data-id"))
          )
        );
      }

      // Insert YouTube player area and integrate with IFrame API
      // Create a player area and insert it above the inputs so it doesn't push lyrics down
      // create a responsive player wrapper and insert into the ytPlayerArea placeholder
      const playerWrapper = document.createElement("div");
      playerWrapper.id = "ytPlayer";
      playerWrapper.className = "mb-2";
      const wrapper = document.createElement("div");
      wrapper.className = "yt-wrapper";
      const ytFrameContainer = document.createElement("div");
      ytFrameContainer.id = "ytframe";
      wrapper.appendChild(ytFrameContainer);
      playerWrapper.appendChild(wrapper);
      const area = document.getElementById("ytPlayerArea");
      if (area) {
        area.innerHTML = "";
        area.appendChild(playerWrapper);
      }

      let ytPlayer = null;
      let ytPollInterval = null;

      // This function will be called by the YouTube API when it's ready
      function onYouTubeIframeAPIReady() {
        // no-op; we'll create a player dynamically in playYT
      }

      function startYTPoll() {
        stopYTPoll();
        ytPollInterval = setInterval(() => {
          try {
            if (ytPlayer && typeof ytPlayer.getCurrentTime === "function") {
              const t = ytPlayer.getCurrentTime();
              highlightForTime(t);
            }
          } catch (e) {
            /* ignore */
          }
        }, 200);
      }
      function stopYTPoll() {
        if (ytPollInterval) {
          clearInterval(ytPollInterval);
          ytPollInterval = null;
        }
      }

      function playYT(id) {
        if (!id) return;
        // create player if missing
        if (!ytPlayer) {
          ytPlayer = new YT.Player("ytframe", {
            height: "100%",
            width: "100%",
            videoId: id,
            playerVars: { autoplay: 1, rel: 0 },
            events: {
              onReady: (e) => {
                e.target.playVideo();
                startYTPoll();
              },
              onStateChange: (e) => {
                // when playing start poll, when paused stop poll
                if (e.data === YT.PlayerState.PLAYING) startYTPoll();
                if (
                  e.data === YT.PlayerState.PAUSED ||
                  e.data === YT.PlayerState.ENDED
                )
                  stopYTPoll();
              },
            },
          });
        } else {
          try {
            ytPlayer.loadVideoById(id);
            startYTPoll();
          } catch (e) {
            console.warn(e);
          }
        }
      }

      // Trigger download/conversion by navigating to /api/ytmp3 which streams the mp3
      function convertYTToMP3(id) {
        if (!id) return;
        const url = `/api/ytmp3?id=${encodeURIComponent(id)}`;
        // create an invisible link to trigger download
        const a = document.createElement("a");
        a.href = url;
        a.download = `${id}.mp3`;
        document.body.appendChild(a);
        a.click();
        a.remove();
      }

      // Open an external web-based converter (vevioz) in a new tab/window
      function openExternalConverter(id) {
        if (!id) return;
        // vevioz provides an embeddable button experience; open their mp3 tool page for this video ID
        const url = `https://api.vevioz.com/@api/button/mp3/e-${encodeURIComponent(
          id
        )}`;
        window.open(url, "_blank", "noopener");
      }

      async function convertWithRapidAPI(id) {
        if (!id) return;
        try {
          console.log("Starting RapidAPI conversion for video ID:", id);
          // Call our server endpoint that uses RapidAPI
          const response = await fetch(
            `/api/ytmp3-rapid?id=${encodeURIComponent(id)}`
          );
          console.log("RapidAPI response status:", response.status);
          const data = await response.json();
          console.log("RapidAPI response data:", data);

          if (data.error) {
            throw new Error(data.error);
          }

          if (data.downloadUrl) {
            console.log("Download URL received:", data.downloadUrl);
            // Create a temporary link to trigger download
            const title = data.title || id;
            const a = document.createElement("a");
            a.href = data.downloadUrl;
            a.download = `${title}.mp3`;
            document.body.appendChild(a);
            a.click();
            a.remove();
          } else {
            throw new Error(
              "No download URL received in response: " + JSON.stringify(data)
            );
          }
        } catch (err) {
          console.error("RapidAPI conversion failed:", err);
          alert("Failed to convert using RapidAPI: " + err.message);
        }
      }

      function escapeHtml(unsafe) {
        return unsafe
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      // Audio sync + highlighting logic
      const audioEl = document.getElementById("audio");
      const audioFileInput = document.getElementById("audioFile");
      const lrcFileInput = document.getElementById("lrcFile");
      const startSyncBtn = document.getElementById("startSyncBtn");
      const finishSyncBtn = document.getElementById("finishSyncBtn");
      const clearSyncBtn = document.getElementById("clearSyncBtn");
      const syncHint = document.getElementById("syncHint");

      let timestamps = []; // seconds for each displayed lyric line
      let lineEls = [];
      let currentLine = -1;
      let syncing = false;
      let syncIndex = 0;
      let lyricsOffset = 0; // seconds to add/subtract to timestamps when syncing with playback

      // When lyrics are rendered, capture their elements
      function captureLineElements() {
        lineEls = Array.from(lyricsDisplay.querySelectorAll("div")).filter(
          (d) => d.innerText.trim() !== ""
        );
      }

      function highlightForTime(t) {
        if (!timestamps || timestamps.length === 0) return;
        // find last index where timestamps[i] <= t
        let i = timestamps.length - 1;
        for (let idx = 0; idx < timestamps.length; idx++) {
          if (t < timestamps[idx] + lyricsOffset) {
            i = idx - 1;
            break;
          }
        }
        if (i < 0) i = 0;
        if (i !== currentLine) {
          if (lineEls[currentLine])
            lineEls[currentLine].classList.remove("current-line");
          currentLine = i;
          if (lineEls[currentLine]) {
            lineEls[currentLine].classList.add("current-line");
            // scroll into view only if not visible to avoid aggressive jumping
            const rect = lineEls[currentLine].getBoundingClientRect();
            const containerRect = lyricsDisplay.getBoundingClientRect();
            if (
              rect.top < containerRect.top + 10 ||
              rect.bottom > containerRect.bottom - 10
            ) {
              lineEls[currentLine].scrollIntoView({
                behavior: "smooth",
                block: "center",
              });
            }
          }
        }
      }

      audioEl.addEventListener("timeupdate", () => {
        highlightForTime(audioEl.currentTime);
      });

      // Load audio file from input
      audioFileInput.addEventListener("change", (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        audioEl.src = URL.createObjectURL(f);
        audioEl.load();

        // Try to read ID3 tags (artist/title) and auto-search lyrics
        try {
          if (window.jsmediatags) {
            window.jsmediatags.read(f, {
              onSuccess: function (tag) {
                const tags = tag.tags || {};
                const artist = (tags.artist || tags.albumartist || "")
                  .toString()
                  .trim();
                const title = (tags.title || "").toString().trim();
                if (artist && title) {
                  artistInput.value = artist;
                  songInput.value = title;
                  // auto-search after small delay so UI updates
                  setTimeout(() => searchLyrics(), 300);
                }
              },
              onError: function (err) {
                // no metadata or unsupported format
                console.warn("jsmediatags error", err);
              },
            });
          }
        } catch (err) {
          console.warn("ID3 read failed", err);
        }
      });

      // Parse basic LRC file
      function parseLRC(text) {
        const lines = text.split(/\r?\n/);
        const parsed = [];
        for (const line of lines) {
          const matches = [
            ...line.matchAll(/\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\]/g),
          ];
          const lyric = line.replace(/\[.*?\]/g, "").trim();
          for (const m of matches) {
            const min = parseInt(m[1], 10);
            const sec = parseInt(m[2], 10);
            const ms = m[3] ? parseInt(m[3].padEnd(3, "0"), 10) : 0;
            const time = min * 60 + sec + ms / 1000;
            parsed.push({ time, text: lyric });
          }
        }
        // sort by time
        parsed.sort((a, b) => a.time - b.time);
        return parsed;
      }

      lrcFileInput.addEventListener("change", async (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        const txt = await f.text();
        const parsed = parseLRC(txt);
        // Map parsed entries to displayed lines: find closest matches
        captureLineElements();
        timestamps = [];
        for (let i = 0; i < lineEls.length; i++) {
          const lineText = lineEls[i].innerText.trim();
          // find first parsed entry whose text includes a portion of line or vice versa
          let found = parsed.find(
            (p) =>
              p.text && (lineText.includes(p.text) || p.text.includes(lineText))
          );
          if (!found) found = parsed[i] || null;
          timestamps.push(found ? found.time : timestamps[i - 1] || 0);
        }
        syncHint.innerText = "LRC loaded — timestamps assigned.";
      });

      // Tap-sync: user starts, then presses Space or clicks to record timestamps for each displayed line
      function startSync() {
        captureLineElements();
        if (lineEls.length === 0) {
          syncHint.innerText = "No lyrics lines to sync.";
          return;
        }
        timestamps = [];
        syncIndex = 0;
        syncing = true;
        // If YouTube player present, play it; otherwise use local audio
        try {
          if (
            typeof ytPlayer !== "undefined" &&
            ytPlayer &&
            typeof ytPlayer.playVideo === "function"
          ) {
            ytPlayer.seekTo(0);
            ytPlayer.playVideo();
          } else {
            audioEl.currentTime = 0;
            audioEl.play();
          }
        } catch (e) {
          audioEl.currentTime = 0;
          audioEl.play();
        }
        syncHint.innerText =
          "Syncing... press Space or click to mark each line.";
        document.addEventListener("keydown", onSyncKey);
        document.addEventListener("click", onSyncClick);
      }

      function finishSync() {
        syncing = false;
        document.removeEventListener("keydown", onSyncKey);
        document.removeEventListener("click", onSyncClick);
        syncHint.innerText = `Sync finished — ${timestamps.length} timestamps recorded.`;
      }

      function clearSync() {
        timestamps = [];
        currentLine = -1;
        lineEls.forEach((el) => el.classList.remove("current-line"));
        syncHint.innerText = "Sync cleared.";
      }

      function onSyncKey(e) {
        if (!syncing) return;
        if (e.code === "Space") {
          e.preventDefault();
          recordTimestamp();
        }
      }
      function onSyncClick(e) {
        if (!syncing) return;
        // avoid clicking on controls registering—only count clicks on lyrics container or body
        const target = e.target;
        if (
          target.closest("#searchBtn") ||
          target.closest("#audioFile") ||
          target.closest("#lrcFile") ||
          target.closest("#startSyncBtn")
        )
          return;
        recordTimestamp();
      }

      function recordTimestamp() {
        if (syncIndex >= lineEls.length) {
          finishSync();
          return;
        }
        // prefer YouTube player time if active
        let time = audioEl.currentTime;
        try {
          if (
            typeof ytPlayer !== "undefined" &&
            ytPlayer &&
            typeof ytPlayer.getCurrentTime === "function"
          ) {
            time = ytPlayer.getCurrentTime();
          }
        } catch (e) {
          /* ignore */
        }
        timestamps[syncIndex] = time - lyricsOffset;
        // mark the line briefly
        const el = lineEls[syncIndex];
        if (el) {
          el.classList.add("current-line");
          setTimeout(() => el.classList.remove("current-line"), 500);
        }
        syncIndex++;
        if (syncIndex >= lineEls.length) finishSync();
      }

      // Anchor current highlighted line to the current playback time (sets lyricsOffset)
      const anchorBtn = document.getElementById("anchorOffsetBtn");
      const resetBtn = document.getElementById("resetOffsetBtn");
      anchorBtn.addEventListener("click", () => {
        // require a currentLine and a playback time
        if (currentLine < 0 || !lineEls[currentLine]) {
          syncHint.innerText = "No current line to anchor.";
          return;
        }
        let playbackTime = audioEl.currentTime;
        try {
          if (ytPlayer && typeof ytPlayer.getCurrentTime === "function")
            playbackTime = ytPlayer.getCurrentTime();
        } catch (e) {}
        // set offset so that timestamps[currentLine] + offset == playbackTime
        if (timestamps[currentLine] != null) {
          lyricsOffset = playbackTime - timestamps[currentLine];
          syncHint.innerText = `Offset set to ${lyricsOffset.toFixed(2)}s`;
        } else {
          syncHint.innerText = "No timestamp for current line to anchor to.";
        }
      });
      resetBtn.addEventListener("click", () => {
        lyricsOffset = 0;
        syncHint.innerText = "Offset reset.";
      });

      startSyncBtn.addEventListener("click", startSync);
      finishSyncBtn.addEventListener("click", finishSync);
      clearSyncBtn.addEventListener("click", clearSync);

      // whenever we render fetched lyrics, recapture elements
      const originalFormattedSetter = lyricsDisplay.innerHTML;
      const observer = new MutationObserver(() => {
        captureLineElements();
      });
      observer.observe(lyricsDisplay, { childList: true, subtree: true });

      // styling for current line
      const style = document.createElement("style");
      style.innerHTML =
        ".current-line{ background: rgba(74,144,226,0.12); padding:4px; border-radius:4px; font-weight:700; color:#FFF; }";
      document.head.appendChild(style);

      // Existing Always-On-Top and drag logic remains unchanged
      // ...
    </script>
  </body>
</html>
